; Raise upload limits for admin hero / media uploads (Hostinger honors .user.ini)
upload_max_filesize = 32M
post_max_size = 40M
max_execution_time = 120
max_input_time = 120
file_uploads = On

; Checkout debugging — logs PHP errors (toggle display via config/debug.enabled)
log_errors = On
error_log = logs/php-error.log
display_errors = Off
